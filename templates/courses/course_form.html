<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
            color: #333;
        }

        .header {
            background-color: #4f46e5;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 70%;
            margin: 30px auto;
        }

        .form-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        .submit {
            margin-top: 25px;
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #4f46e5;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>{{ page_title }}</h1>
        <p>Smart E-Learning Management System</p>
    </div>

    <div class="container">

        <div class="form-box">

            <form method="POST">

                {% csrf_token %}

                <label>Course Title</label>
                <input
                    type="text"
                    name="title"
                    value="{{ course.title|default:'' }}"
                    required
                >

                <label>Description</label>
                <textarea
                    name="description"
                    required
                >{{ course.description|default:'' }}</textarea>

                <label>Instructor</label>
                <input
                    type="text"
                    name="instructor"
                    value="{{ course.instructor|default:'' }}"
                    required
                >

                <label>Duration</label>
                <input
                    type="text"
                    name="duration"
                    value="{{ course.duration|default:'' }}"
                    placeholder="Example: 4 Weeks"
                    required
                >

                <label>Difficulty</label>

                <select name="difficulty" required>

                    <option value="Beginner" {% if course.difficulty == "Beginner" %}selected{% endif %}>
                        Beginner
                    </option>

                    <option value="Intermediate" {% if course.difficulty == "Intermediate" %}selected{% endif %}>
                        Intermediate
                    </option>

                    <option value="Advanced" {% if course.difficulty == "Advanced" %}selected{% endif %}>
                        Advanced
                    </option>

                </select>

                <button class="submit" type="submit">
                    Save Course
                </button>

            </form>

            <a class="back" href="{% url 'manage_courses' %}">
                ← Back to Courses
            </a>

        </div>

    </div>

</body>
</html>
