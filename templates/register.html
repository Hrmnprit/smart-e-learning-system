<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Smart E-Learning</title>


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #dbeafe;
        }


        .container {
            width: 400px;
            margin: 60px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }


        h1 {
            text-align: center;
            color: #1e3a8a;
        }


        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }


        .password-box {
            position: relative;
        }


        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }


        .password-box input {
            padding-right: 40px;
        }


        .eye {
            position: absolute;
            right: 10px;
            top: 10px;
            cursor: pointer;
            font-size: 20px;
        }


        .requirements {
            display: none;
            margin-top: 10px;
            font-size: 13px;
        }


        .requirements p {
            margin: 5px 0;
        }


        .valid {
            color: green;
        }


        .invalid {
            color: red;
        }


        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }


        .login {
            text-align: center;
            margin-top: 20px;
        }


        .login a {
            color: #2563eb;
            text-decoration: none;
        }


        .message {
            text-align: center;
            color: red;
        }

    </style>

</head>


<body>


    <div class="container">

        <h1>Create Account</h1>


        {% if messages %}

            {% for message in messages %}

                <p class="message">
                    {{ message }}
                </p>

            {% endfor %}

        {% endif %}


        <form method="POST"
              onsubmit="return checkPassword()">

            {% csrf_token %}


            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                required
            >


            <label>
                Password
            </label>


            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    oninput="checkRequirements()"
                >

                <span
                    class="eye"
                    onclick="togglePassword()"
                    id="eye">
                    👁
                </span>

            </div>


            <div
                class="requirements"
                id="requirements">

                <p id="length">
                    ❌ At least 8 characters
                </p>

                <p id="uppercase">
                    ❌ At least 1 uppercase letter
                </p>

                <p id="lowercase">
                    ❌ At least 1 lowercase letter
                </p>

                <p id="number">
                    ❌ At least 1 number
                </p>

                <p id="special">
                    ❌ At least 1 special character
                </p>

            </div>


            <label>
                Confirm Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                >

                <span
                    class="eye"
                    onclick="toggleConfirmPassword()">
                    👁
                </span>

            </div>


            <button type="submit">
                Register
            </button>

        </form>


        <div class="login">

            Already have an account?

            <a href="#">
                Login
            </a>

        </div>


    </div>



    <script>

        function checkRequirements() {

            let password =
                document.getElementById("password").value;

            let requirements =
                document.getElementById("requirements");


            if (password.length > 0) {

                requirements.style.display = "block";

            } else {

                requirements.style.display = "none";

            }


            if (password.length >= 8) {

                document.getElementById("length").innerHTML =
                    "✅ At least 8 characters";

                document.getElementById("length").className =
                    "valid";

            } else {

                document.getElementById("length").innerHTML =
                    "❌ At least 8 characters";

                document.getElementById("length").className =
                    "invalid";

            }


            if (/[A-Z]/.test(password)) {

                document.getElementById("uppercase").innerHTML =
                    "✅ At least 1 uppercase letter";

                document.getElementById("uppercase").className =
                    "valid";

            } else {

                document.getElementById("uppercase").innerHTML =
                    "❌ At least 1 uppercase letter";

                document.getElementById("uppercase").className =
                    "invalid";

            }


            if (/[a-z]/.test(password)) {

                document.getElementById("lowercase").innerHTML =
                    "✅ At least 1 lowercase letter";

                document.getElementById("lowercase").className =
                    "valid";

            } else {

                document.getElementById("lowercase").innerHTML =
                    "❌ At least 1 lowercase letter";

                document.getElementById("lowercase").className =
                    "invalid";

            }


            if (/[0-9]/.test(password)) {

                document.getElementById("number").innerHTML =
                    "✅ At least 1 number";

                document.getElementById("number").className =
                    "valid";

            } else {

                document.getElementById("number").innerHTML =
                    "❌ At least 1 number";

                document.getElementById("number").className =
                    "invalid";

            }


            if (/[@#$%!^&*]/.test(password)) {

                document.getElementById("special").innerHTML =
                    "✅ At least 1 special character";

                document.getElementById("special").className =
                    "valid";

            } else {

                document.getElementById("special").innerHTML =
                    "❌ At least 1 special character";

                document.getElementById("special").className =
                    "invalid";

            }

        }



        function togglePassword() {

            let password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }



        function toggleConfirmPassword() {

            let password =
                document.getElementById("confirm_password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }



        function checkPassword() {

            let password =
                document.getElementById("password").value;

            let confirmPassword =
                document.getElementById("confirm_password").value;


            if (password.length < 8) {

                alert("Password must be at least 8 characters long!");

                return false;

            }


            if (!/[A-Z]/.test(password)) {

                alert("Password must contain an uppercase letter!");

                return false;

            }


            if (!/[a-z]/.test(password)) {

                alert("Password must contain a lowercase letter!");

                return false;

            }


            if (!/[0-9]/.test(password)) {

                alert("Password must contain a number!");

                return false;

            }


            if (!/[@#$%!^&*]/.test(password)) {

                alert("Password must contain a special character!");

                return false;

            }


            if (password !== confirmPassword) {

                alert("Passwords do not match!");

                return false;

            }


            return true;

        }

    </script>


</body>

</html>
