<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Quiz</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
        }

        .delete-box {
            background-color: white;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        h1 {
            color: #dc3545;
        }

        p {
            color: #555;
            font-size: 16px;
        }

        .quiz-name {
            font-weight: bold;
            color: #333;
        }

        .buttons {
            margin-top: 25px;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .cancel-btn {
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            padding: 11px 20px;
            border-radius: 5px;
            margin-left: 8px;
        }

        .delete-btn:hover {
            background-color: #bb2d3b;
        }

        .cancel-btn:hover {
            background-color: #5c636a;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="delete-box">

        <h1>Delete Quiz</h1>

        <p>
            Are you sure you want to delete this quiz?
        </p>

        <p class="quiz-name">
            "{{ quiz.title }}"
        </p>

        <p>
            All questions belonging to this quiz will also be deleted.
        </p>


        <div class="buttons">

            <form method="POST" style="display: inline;">

                {% csrf_token %}

                <button
                    type="submit"
                    class="delete-btn"
                >
                    Yes, Delete
                </button>

            </form>


            <a
                href="{% url 'quiz_list' %}"
                class="cancel-btn"
            >
                Cancel
            </a>

        </div>

    </div>

</div>

</body>

</html>
